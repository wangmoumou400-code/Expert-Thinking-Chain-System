<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CPS反馈批量验证</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <h1>CPS反馈批量验证</h1>
        <p>用于预实验前批量跑测试初稿库。页面会逐条调用现有 /api/feedback，并把每条结果保存到数据库。</p>
      </div>
      <a class="text-link" href="/">返回单条生成</a>
    </header>

    <section class="panel">
      <div class="note">
        建议先只勾选 3-5 个样本或只跑 B/C/D 中一个条件，确认模型、数据库和中文显示正常后，再运行全集。
      </div>

      <div class="grid">
        <label>
          被试编号前缀
          <input id="participantPrefix" autocomplete="off" value="pilot">
        </label>
        <label>
          每条间隔（毫秒）
          <input id="delayMs" type="number" min="0" step="100" value="1200">
        </label>
      </div>

      <label>
        反馈条件
        <div class="check-row">
          <label><input type="checkbox" name="condition" value="B" checked> 材料B：结果性评分</label>
          <label><input type="checkbox" name="condition" value="C" checked> 材料C：结构化反馈</label>
          <label><input type="checkbox" name="condition" value="D" checked> 材料D：CMC元认知反馈</label>
        </div>
      </label>

      <label>
        JSONL测试初稿集合
        <textarea id="jsonlInput" rows="14" placeholder='每行一个JSON对象，例如：{"draft_id":"A01","draft":"完整CPS文本"}'></textarea>
      </label>

      <div class="actions">
        <button id="loadSample" type="button" class="secondary">载入内置测试库</button>
        <button id="runBatch" type="button">开始批量运行</button>
        <button id="stopBatch" type="button" class="ghost" disabled>停止</button>
        <button id="downloadJsonl" type="button" class="secondary" disabled>下载结果JSONL</button>
        <button id="clearBatch" type="button" class="ghost">清空</button>
      </div>
    </section>

    <section class="panel output">
      <div class="output-head">
        <div>
          <h2>运行状态</h2>
          <p id="batchMeta">等待载入测试集合。</p>
        </div>
        <div class="timer" id="batchCounter">0/0</div>
      </div>
      <pre id="batchLog">尚未开始。</pre>
    </section>
  </main>

  <script src="/batch.js"></script>
</body>
</html>
