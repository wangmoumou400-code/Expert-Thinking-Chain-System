<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>专家反馈系统</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <h1>专家反馈系统</h1>
        <p>用于普通毛绒兔产品改进任务。请按实验编号提交内容。</p>
      </div>
      <a class="text-link" href="/batch.html">批量验证</a>
    </header>

    <section class="panel">
      <div class="grid">
        <label>
          被试编号
          <input id="participantId" autocomplete="off" placeholder=" ">
        </label>
        <label>
          组别编号
          <select id="materialCode">
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
          </select>
        </label>
      </div>

      <label>
        提交毛绒兔子改进方案
        <textarea id="draft" rows="14" placeholder="请粘贴任务一初稿“可填写”这一列的内容"></textarea>
      </label>

      <div class="actions">
        <button id="generate">生成反馈</button>
        <button id="clear" type="button" class="secondary">清空</button>
      </div>
    </section>

    <section class="panel output">
      <div class="output-head">
        <div>
          <h2>反馈结果</h2>
          <p id="meta">等待生成反馈。</p>
        </div>
        <div class="timer" id="timer">00:00</div>
      </div>
      <pre id="result">请先提交反馈前方案。</pre>
      <div class="actions">
        <button id="copy" type="button" class="secondary">复制反馈</button>
        <button id="complete" type="button" class="ghost" disabled>完成阅读</button>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
